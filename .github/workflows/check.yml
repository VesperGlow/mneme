name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Check and build Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m py_compile services/models/*.py scripts/*.py tests/fixtures/*.py
      - run: node --check web/app.js && node --check scripts/console-browser-test.cjs
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package binary and configuration
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist/mneme-linux-amd64
          install -m 755 target/release/mneme dist/mneme-linux-amd64/mneme
          cp -R config docs README.md LICENSE .env.example dist/mneme-linux-amd64/
          printf '%s\n' "$COMMIT_SHA" > dist/mneme-linux-amd64/COMMIT
          tar -C dist -czf dist/mneme-linux-amd64.tar.gz mneme-linux-amd64
          cd dist
          sha256sum mneme-linux-amd64.tar.gz > mneme-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mneme-linux-amd64
          path: |
            dist/mneme-linux-amd64.tar.gz
            dist/mneme-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

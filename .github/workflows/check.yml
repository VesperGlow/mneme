name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Image build plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/image-plan.py

  rust:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m py_compile services/models/*.py scripts/*.py tests/fixtures/*.py
      - run: python3 -m pip install -c services/models/requirements.lock.txt requests fastapi uvicorn
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: services/tools/package-lock.json
      - run: npm ci --prefix services/tools --no-audit --no-fund
      - run: node --check web/app.js && node --check scripts/console-browser-test.cjs && node --check scripts/stickers-browser-test.cjs && node --check scripts/persona-browser-test.cjs && node --check scripts/interaction-browser-test.cjs
      - run: node --test services/tools/test/*.test.mjs
      - run: for file in services/tools/*.mjs scripts/smoke-tools.mjs; do node --check "$file"; done

  containers:
    name: Container / ${{ matrix.image }} / amd64
    needs: [rust, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose build or reuse
        id: mode
        env:
          BUILD: ${{ matrix.build }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [ "$BUILD" = true ] || ! docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse unchanged image
        if: steps.mode.outputs.build == 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mneme_source_manifest=$(docker buildx imagetools inspect --raw "$IMAGE:latest" | sha256sum)
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:sha-$COMMIT_SHA" "$IMAGE:latest"
          mneme_reused_manifest=$(docker buildx imagetools inspect --raw "$IMAGE:sha-$COMMIT_SHA" | sha256sum)
          test "$mneme_source_manifest" = "$mneme_reused_manifest"
          printf '### %s reused\n\nImage inputs are unchanged; no layers were rebuilt or downloaded.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Build amd64 image
        if: steps.mode.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - name: Verify architecture and save Podman-compatible archive
        if: steps.mode.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          ARCHIVE: ${{ matrix.image }}-linux-amd64.tar.gz
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          mkdir -p dist
          docker save "$IMAGE" | gzip -1 > "dist/$ARCHIVE"
          cd dist
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Verify archive and runtime with Podman
        if: steps.mode.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          SERVICE: ${{ matrix.image }}
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          sudo podman load -i "dist/$SERVICE-linux-amd64.tar.gz"
          test "$(sudo podman image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          if [ "$SERVICE" = mneme-models ]; then
            sudo podman run --rm --network none --read-only --cap-drop all --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=256m "$IMAGE" \
              python -c 'import torch, engine; assert torch.version.cuda is None; model=engine.Engine(); vectors=model.embed(["我喜欢不加糖的拿铁。"],query=True); scores=model.rerank("我喜欢什么咖啡？",["不加糖的拿铁咖啡。","周末去爬山。"]); assert len(vectors[0])==1024; assert abs(sum(v*v for v in vectors[0])-1)<0.001; assert scores[0]>scores[1]; print("Bundled CPU models: offline loading, 1024 dimensions and Chinese reranking passed")'
          elif [ "$SERVICE" = mneme-tools ]; then
            sudo timeout --kill-after=15s 180s env MNEME_TOOLS_IMAGE="$IMAGE" bash scripts/smoke-tools.sh
          else
            trap 'sudo podman rm -f mneme-ci >/dev/null 2>&1 || true' EXIT
            sudo podman run -d --name mneme-ci --read-only --cap-drop all --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 \
              -e MNEME_DATABASE=/tmp/ci.sqlite3 \
              -e MNEME_API_TOKEN=mneme-ci-only-token-01234567890123456789 \
              -e MNEME_LLM_API_KEY=ci-fixture-only \
              -e MNEME_LLM_MODEL=ci-fixture \
              -e MNEME_QQ_APP_ID=12345678 -e MNEME_QQ_APP_SECRET=ci-qq-fixture-secret \
              -e MNEME_QQ_LISTEN=0.0.0.0:8081 \
              -e MNEME_NEO4J_PASSWORD=ci-fixture-only-password "$IMAGE"
            for attempt in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:18080/health/live && break
              sleep 1
            done
            curl -fsS -o /dev/null http://127.0.0.1:18080/health/live
            curl -fsS -o /dev/null http://127.0.0.1:18080/console/
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/memories)" = 401
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:18081/qqbot)" = 401
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/console/)" = 404
          fi
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.build == 'true'
        with:
          name: ${{ matrix.image }}-linux-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish to GHCR
        if: steps.mode.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:latest"
          printf '### %s (linux/amd64)\n\n`%s:sha-%s`\n' "$IMAGE" "$IMAGE" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"

services:
  companion:
    image: ghcr.io/vesperglow/mneme:latest
    container_name: mneme
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      QQ_APP_ID: ${QQ_APP_ID}
      QQ_APP_SECRET: ${QQ_APP_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      system: ${system}
      persona: ${persona}
      COMPANION_MEMORY_QUEUE_SIZE: ${COMPANION_MEMORY_QUEUE_SIZE:-32}
      COMPANION_SUMMARY_EVERY: ${COMPANION_SUMMARY_EVERY:-20}
      COMPANION_BACKUP_INTERVAL_HOURS: ${COMPANION_BACKUP_INTERVAL_HOURS:-24}
      COMPANION_BACKUP_RETENTION_DAYS: ${COMPANION_BACKUP_RETENTION_DAYS:-14}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-mneme/backups}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./data:/data

services:
  companion:
    image: ghcr.io/vesperglow/mneme:latest
    container_name: mneme
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      QQ_APP_ID: ${QQ_APP_ID}
      QQ_APP_SECRET: ${QQ_APP_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      system: ${system}
      persona: ${persona}
    volumes:
      - ./data:/data

listen = "127.0.0.1:8080"
database = "data/mneme.sqlite3"
timezone = "+08:00"

[llm]
# 必须含 /v1；API Key 从 MNEME_LLM_API_KEY 读取。
base_url = "https://api.example.com/v1"
model = "auto"
temperature = 0.7
max_tokens = 1200
timeout_seconds = 120
context_tokens = 100000
# 仅在服务支持 response_format json_schema 时启用；默认兼容原有提供商。
json_schema = false
# Legacy persona_request_options is accepted but unused; automatic persona generation is retired.
# 兼容旧配置；自动压缩由 context_tokens 预算触发，不再按轮数触发。
history_turns = 1000
summary_tokens = 2000
# 非 OpenAI 模型建议配置对应的本地 tokenizer.json；默认回退会明确标记估算。
# tokenizer_path = "/config/tokenizer.json"

[console]
# 使用时续期；Cookie 和服务端会话均跨刷新、浏览器关闭与服务重启保留。
session_days = 30
# HTTPS 反向代理部署设为 true；本机 HTTP / SSH 转发保留 false。
secure_cookie = false
# 初始密码从 MNEME_CONSOLE_PASSWORD 导入一次，后续在 WebUI 修改。

[models]
base_url = "http://127.0.0.1:8090"
dimensions = 1024
timeout_seconds = 45

[neo4j]
base_url = "http://127.0.0.1:7474"
database = "neo4j"
username = "neo4j"
# 密码从 MNEME_NEO4J_PASSWORD 读取。

[memory]
# 累计完整用户/助手原文 Token；较小批次最迟在等待时限后异步提取。
extract_every_tokens = 2048
extract_max_delay_seconds = 120
candidate_limit = 32
recall_limit = 6
context_tokens = 4000
# 以下两个门槛仅用于长期偏好确认；情景压缩不按价值过滤。
minimum_importance = 0.4
minimum_confidence = 0.7
# 情景层允许日常观点和经历；30 天有效期、7 天半衰期，最多 256 条有效情景。
half_life_days = 180.0
forget_below = 0.12
max_attempts = 8
poll_seconds = 2
retrieval_timeout_seconds = 8
rerank_min_score = 0.1
# 精排同时保留最高相关分数的 80% 以上；0 可关闭相对门槛。
rerank_relative_min = 0.8
# cosine 不足的改写仅可由强精排证据补救；所有候选均通过精排。
vector_min_score = 0.4
rerank_rescue_score = 0.6
# 仅有向量与精排绝对分数支持、但未通过最终门槛的问题，允许一次无记忆输入的语义改写。
semantic_rewrite = false
# 覆盖属性键之前单独判断矛盾/共存；语义答案证据核验与 CPU 精排并行。
reconcile_updates = true
verify_recall = false
# 引用存在还不足以证明事实；拒绝事实与原话完全不相关的候选。不能替代否定/假设判定。
evidence_min_score = 0.5
allow_sensitive = false

[persona]
name = "Mneme"
description = "你是 Mneme，一个以中文交流为主、温暖细腻、诚实可靠的 AI 陪伴者。"
style = "自然、具体、有分寸。"
boundaries = "坦诚自己的 AI 身份与能力，尊重用户的现实关系。"
# 可在 WebUI 中配置回复结构、Markdown 或 JSON 等输出格式；留空不额外约束。
output_format = ""

[tools]
# 原生运行默认关闭；安装脚本通过环境变量启用并生成独立凭证。
enabled = false
base_url = "http://127.0.0.1:8091"
max_calls = 200
timeout_seconds = 30
turn_timeout_seconds = 1800
